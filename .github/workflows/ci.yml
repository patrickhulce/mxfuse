name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake g++ pkg-config
      - name: Generate fixture
        run: |
          chmod +x scripts/generate-fixture.sh
          ./scripts/generate-fixture.sh
      - run: make lint-rust test-rust

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Generate fixture
        run: ./scripts/generate-fixture.sh
        shell: bash
      - run: make build-python lint-python typecheck-python test-python

  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install
      - name: Generate fixture
        run: ./scripts/generate-fixture.sh
        shell: bash
      - run: make build-node lint-node typecheck-node test-node
      - name: Check linkage
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x scripts/check-linkage.sh
          node_bin="$(find src/node-mxfuse -maxdepth 1 -name '*.node' | head -n 1)"
          ./scripts/check-linkage.sh "$node_bin"

  patches:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Apply patches to a pristine vendor/bmx copy
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp -a vendor/bmx/. "$work/"
          shopt -s nullglob
          patches=(patches/*.patch)
          if [ "${#patches[@]}" -eq 0 ]; then
            echo "no patches found under patches/"
            exit 1
          fi
          for patch in "${patches[@]}"; do
            echo "Applying ${patch}"
            patch -d "$work" -p1 --fuzz=0 --forward --silent < "$patch"
          done
          echo "applied ${#patches[@]} patch(es)"
