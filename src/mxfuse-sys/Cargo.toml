[package]
name = "mxfuse-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
links = "bmx"
description = "Static FFI bindings to a vendored bmx / libMXF stack"
readme = "README.md"
documentation = "https://docs.rs/mxfuse-sys"
keywords = ["mxf", "bmx", "ffi"]
categories = ["multimedia", "external-ffi-bindings"]
include = [
    "src/**",
    "shim/**",
    "build.rs",
    "generated/**",
    "README.md",
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
]

[lib]
path = "src/lib.rs"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[build-dependencies]
cc = "1"
cmake = "0.1"
diffy = "0.4"
