[workspace]
members = [
    "src/mxfuse-sys",
    "src/rust-mxfuse",
    "src/python-mxfuse",
    "src/node-mxfuse",
]
default-members = [
    "src/rust-mxfuse",
    "src/node-mxfuse",
]
resolver = "2"

[workspace.package]
# Source tree is always 0.0.0-dev (valid Cargo, npm, and PEP 440). Tags stamp it.
version = "0.0.0-dev"
edition = "2021"
license = "MIT"
authors = ["mxfuse contributors"]
repository = "https://github.com/patrickhulce/mxfuse"
homepage = "https://github.com/patrickhulce/mxfuse"
documentation = "https://docs.rs/mxfuse"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
